<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Image Comparison Slider with Diff Toggle</title>
	<link rel="stylesheet" href="../assets/style.css">
</head>

<body>
	<div class="compare">
		<div class="image-container">
			<img id="baseImage" src="{secondImage}" alt="Second Image">
			<div class="image-overlay">
				<img src="{originalImage}" alt="Original Image">
			</div>
			<div class="slider">
				<div class="slider-line"></div>
				<div class="slider-button"></div>
			</div>
			<div class="image-label left-label">Original Image</div>
			<div class="image-label right-label" id="rightLabel">Second Image</div>
			<button class="toggle-button" id="toggleButton">Show Diff</button>
		</div>
	</div>
	<script src="../assets/script.js"></script>
</body>
</html>
