<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Comparison Slider with Diff Toggle</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            overflow: auto;
        }
        .compare {
            position: relative;
            width: 100%;
            overflow: hidden;
        }
        .compare img {
            display: block;
            width: 100%;
            height: auto;
        }
        .image-container {
            position: relative;
        }
        .image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            clip-path: inset(0 50% 0 0);
        }
        .slider {
            position: absolute;
            z-index: 3;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 40px;
            transform: translateX(-50%);
            cursor: col-resize;
        }
        .slider-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .slider-button {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: white;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .slider-button:before,
        .slider-button:after {
            content: '';
            position: absolute;
            top: 50%;
            border: 6px solid transparent;
        }
        .slider-button:before {
            left: 2px;
            border-right-color: #999;
        }
        .slider-button:after {
            right: 2px;
            border-left-color: #999;
        }
        .image-label {
            position: absolute;
            top: 20px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
            z-index: 4;
        }
        .left-label {
            left: 20px;
        }
        .right-label {
            right: 20px;
        }
        .toggle-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background-color: rgba(255, 255, 255, 0.7);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            z-index: 5;
        }
    </style>
</head>
<body>
    <div class="compare">
        <div class="image-container">
            <img id="baseImage" src="20250220-the-best-soft-chocolate-chip-cookies-tr-314.png" alt="Second Image">
            <div class="image-overlay">
                <img src="20250220-the-best-soft-chocolate-chip-cookies-master.png" alt="Original Image">
            </div>
            <div class="slider">
                <div class="slider-line"></div>
                <div class="slider-button"></div>
            </div>
            <div class="image-label left-label">Original Image</div>
            <div class="image-label right-label" id="rightLabel">Second Image</div>
            <button class="toggle-button" id="toggleButton">Show Diff</button>
        </div>
    </div>

    <script>
        const slider = document.querySelector('.slider');
        const overlay = document.querySelector('.image-overlay');
        const baseImage = document.getElementById('baseImage');
        const toggleButton = document.getElementById('toggleButton');
        const rightLabel = document.getElementById('rightLabel');
        let isResizing = false;
        let isDiffShowing = false;

        slider.addEventListener('mousedown', (e) => {
            isResizing = true;
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        });

        function onMouseMove(e) {
            if (!isResizing) return;
            const container = slider.closest('.compare');
            const containerRect = container.getBoundingClientRect();
            let pos = (e.pageX - containerRect.left) / containerRect.width;
            pos = Math.max(0, Math.min(1, pos));
            overlay.style.clipPath = `inset(0 ${(1 - pos) * 100}% 0 0)`;
            slider.style.left = pos * 100 + '%';
        }

        function onMouseUp() {
            isResizing = false;
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
        }

        toggleButton.addEventListener('click', () => {
            isDiffShowing = !isDiffShowing;
            if (isDiffShowing) {
                baseImage.src = 'diff.png';
                toggleButton.textContent = 'Show Second Image';
                rightLabel.textContent = 'Diff Image';
            } else {
                baseImage.src = '20250220-the-best-soft-chocolate-chip-cookies-master.png';
                toggleButton.textContent = 'Show Diff';
                rightLabel.textContent = 'Second Image';
            }
        });
    </script>
</body>
</html>
