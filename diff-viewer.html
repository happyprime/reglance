<!DOCTYPE html>
<html>
<head>
	<title>Diff Viewer</title>
	<style>
		.modal {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.9);
			z-index: 1000;
		}

		.modal-content {
			position: relative;
			width: 100%;
			height: 100%;
			display: flex;
			flex-direction: column;
		}

		.modal-header {
			background: #333;
			color: white;
			padding: 1rem;
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.modal-title {
			font-size: 1.2rem;
			font-weight: bold;
		}

		.modal-close {
			background: none;
			border: none;
			color: white;
			font-size: 1.5rem;
			cursor: pointer;
		}

		.modal-body {
			flex: 1;
			display: flex;
			justify-content: center;
			align-items: center;
			overflow: auto;
		}

		.modal-image {
			max-width: 100%;
			max-height: 100%;
			object-fit: contain;
		}

		.modal-nav {
			position: absolute;
			top: 50%;
			transform: translateY(-50%);
			background: rgba(0, 0, 0, 0.5);
			color: white;
			border: none;
			padding: 1rem;
			cursor: pointer;
			font-size: 1.5rem;
		}

		.modal-prev {
			left: 0;
		}

		.modal-next {
			right: 0;
		}

		.modal-nav:hover {
			background: rgba(0, 0, 0, 0.8);
		}
	</style>
</head>
<body>
	<div id="diffModal" class="modal">
		<div class="modal-content">
			<div class="modal-header">
				<div class="modal-title" id="modalTitle"></div>
				<button class="modal-close" onclick="closeModal()">&times;</button>
			</div>
			<div class="modal-body">
				<button class="modal-nav modal-prev" onclick="navigateDiff(-1)">&larr;</button>
				<img id="modalImage" class="modal-image" src="" alt="Diff Image">
				<button class="modal-nav modal-next" onclick="navigateDiff(1)">&rarr;</button>
			</div>
		</div>
	</div>

	<script>
		let currentDiffIndex = 0;
		let diffs = [];

		function openModal(diffData, index) {
			currentDiffIndex = index;
			diffs = diffData;
			const modal = document.getElementById('diffModal');
			const modalTitle = document.getElementById('modalTitle');
			const modalImage = document.getElementById('modalImage');

			modal.style.display = 'block';
			updateModalContent();
		}

		function closeModal() {
			document.getElementById('diffModal').style.display = 'none';
		}

		function navigateDiff(direction) {
			currentDiffIndex = (currentDiffIndex + direction + diffs.length) % diffs.length;
			updateModalContent();
		}

		function updateModalContent() {
			const currentDiff = diffs[currentDiffIndex];
			document.getElementById('modalTitle').textContent =
				`${currentDiff.property} - ${currentDiff.urlKey} (${currentDiff.viewport.name})`;
			document.getElementById('modalImage').src = currentDiff.diffUrl;
		}

		// Close modal when clicking outside
		window.onclick = function(event) {
			const modal = document.getElementById('diffModal');
			if (event.target === modal) {
				closeModal();
			}
		}

		// Handle keyboard navigation
		document.addEventListener('keydown', function(event) {
			if (document.getElementById('diffModal').style.display === 'block') {
				if (event.key === 'ArrowLeft') {
					navigateDiff(-1);
				} else if (event.key === 'ArrowRight') {
					navigateDiff(1);
				} else if (event.key === 'Escape') {
					closeModal();
				}
			}
		});
	</script>
</body>
</html>
