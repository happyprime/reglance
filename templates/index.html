<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{name} - Visual Regression Reports</title>
	<link rel="stylesheet" href="../assets/index-style.css">
</head>
<body>
	<h1>{name} - Visual Regression Reports</h1>

	<div class="settings">
		<h2>Comparison Settings</h2>
		<div class="settings-grid">
			<div class="setting-item">
				<span class="setting-label">Threshold</span>
				<span class="setting-value">{threshold}</span>
			</div>
			<div class="setting-item">
				<span class="setting-label">Include Anti-Aliasing</span>
				<span class="setting-value">{includeAA}</span>
			</div>
			<div class="setting-item">
				<span class="setting-label">Alpha Threshold</span>
				<span class="setting-value">{alpha}</span>
			</div>
			<div class="setting-item">
				<span class="setting-label">Diff Color</span>
				<span class="setting-value" style="color: rgb({diffColor})">RGB({diffColor})</span>
			</div>
		</div>
	</div>

	<div class="filter-bar">
		<label>Search: <input type="text" id="filterSearch" placeholder="Filter by URL..."></label>
		<label>Viewport:
			<select id="filterViewport">
				<option value="">All</option>
				{viewportOptions}
			</select>
		</label>
		<label>Differences:
			<select id="filterDiff">
				<option value="">All</option>
				<option value="has">Has differences</option>
				<option value="none">No differences</option>
			</select>
		</label>
	</div>

	<div class="table-wrapper">
	<table id="reportsTable">
		<thead>
			<tr>
				<th data-sort="url" aria-sort="none"><button type="button" class="th-sort">URL <span class="sort-indicator" aria-hidden="true"></span></button></th>
				<th data-sort="viewport" aria-sort="none"><button type="button" class="th-sort">Viewport <span class="sort-indicator" aria-hidden="true"></span></button></th>
				<th data-sort="diff" aria-sort="none"><button type="button" class="th-sort">Visual Difference <span class="sort-indicator" aria-hidden="true"></span></button></th>
				<th data-sort="html" aria-sort="none"><button type="button" class="th-sort">HTML Changes <span class="sort-indicator" aria-hidden="true"></span></button></th>
				<th>Report</th>
				<th>Visual Diff</th>
				<th>HTML Diff</th>
			</tr>
		</thead>
		<tbody>
		{rows}
			<tr id="emptyRow" hidden><td colspan="7" aria-live="polite">No comparisons match your filters.</td></tr>
		</tbody>
	</table>
	</div>
	{diffViewer}
	<script>
		window.diffData = {diffData};
	</script>
	<script>
	(function() {
		const search = document.getElementById('filterSearch');
		const viewport = document.getElementById('filterViewport');
		const diff = document.getElementById('filterDiff');
		const tbody = document.querySelector('#reportsTable tbody');

		const emptyRow = document.getElementById('emptyRow');

		function filterRows() {
			const q = search.value.toLowerCase();
			const vp = viewport.value;
			const d = diff.value;
			const rows = tbody.querySelectorAll('tr[data-url]');
			rows.forEach(function(row) {
				const url = row.getAttribute('data-url').toLowerCase();
				const rv = row.getAttribute('data-viewport');
				const dp = parseFloat(row.getAttribute('data-diff'));
				let show = true;
				if (q && url.indexOf(q) === -1) show = false;
				if (vp && rv !== vp) show = false;
				if (d === 'has' && dp === 0) show = false;
				if (d === 'none' && dp > 0) show = false;
				row.style.display = show ? '' : 'none';
			});
			// Show the empty-state row only when every data row is hidden.
			const anyVisible = Array.from(rows).some(function(r) { return r.style.display !== 'none'; });
			emptyRow.hidden = anyVisible;
		}

		search.addEventListener('input', filterRows);
		viewport.addEventListener('change', filterRows);
		diff.addEventListener('change', filterRows);

		// Sorting. The button inside each sortable header is natively
		// focusable and Enter/Space-activatable, so keyboard users can sort.
		let currentSort = { col: null, asc: true };
		document.querySelectorAll('th[data-sort] .th-sort').forEach(function(button) {
			button.addEventListener('click', function() {
				const th = button.closest('th');
				const col = th.getAttribute('data-sort');
				if (currentSort.col === col) {
					currentSort.asc = !currentSort.asc;
				} else {
					currentSort.col = col;
					currentSort.asc = true;
				}
				const rows = Array.from(tbody.querySelectorAll('tr[data-url]'));
				rows.sort(function(a, b) {
					let va, vb;
					if (col === 'url') {
						va = a.getAttribute('data-url');
						vb = b.getAttribute('data-url');
					} else if (col === 'viewport') {
						va = a.getAttribute('data-viewport');
						vb = b.getAttribute('data-viewport');
					} else if (col === 'diff') {
						va = parseFloat(a.getAttribute('data-diff'));
						vb = parseFloat(b.getAttribute('data-diff'));
						return currentSort.asc ? va - vb : vb - va;
					} else if (col === 'html') {
						va = a.children[3].textContent;
						vb = b.children[3].textContent;
					}
					if (va < vb) return currentSort.asc ? -1 : 1;
					if (va > vb) return currentSort.asc ? 1 : -1;
					return 0;
				});
				rows.forEach(function(r) { tbody.appendChild(r); });
				// Reflect sort state to assistive tech and the arrow glyph.
				document.querySelectorAll('th[data-sort]').forEach(function(h) {
					h.setAttribute('aria-sort', 'none');
					h.querySelector('.sort-indicator').textContent = '';
				});
				th.setAttribute('aria-sort', currentSort.asc ? 'ascending' : 'descending');
				th.querySelector('.sort-indicator').textContent = currentSort.asc ? '▲' : '▼';
			});
		});
	})();
	</script>
</body>
</html>
