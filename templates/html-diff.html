<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>HTML Diff - {name} - {urlKey} - {viewportName}</title>
	<style>
		body { font-family: 'Menlo', 'Monaco', 'Courier New', monospace; margin: 2rem; line-height: 1.5; }
		.diff-content { background: #f8f8f8; padding: 1rem; border-radius: 4px; overflow-x: auto; }
		.diff-added { background-color: #e6ffec; }
		.diff-removed { background-color: #ffeef0; }
		.diff-unchanged { color: #666; }
		.line-number {
			display: inline-block;
			width: 2rem;
			text-align: center;
			color: #999;
			user-select: none;
		}
		.line-content {
			display: inline-block;
			white-space: pre;
			tab-size: 4;
		}
		pre { margin: 0; }
	</style>
</head>
<body>
	<h1>HTML Diff Report</h1>
	<p>Site: {name}</p>
	<p>URL: {urlKey}</p>
	<p>Viewport: {viewportName} ({viewportWidth}x{viewportHeight}){viewportDpr}</p>
	<p>Status: {status}</p>
	<div class="diff-content">
		<pre>{diffContent}</pre>
	</div>
</body>
</html>
