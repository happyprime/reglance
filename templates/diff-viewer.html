<style>
	.modal {
		position: fixed;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
		background: rgba(0, 0, 0, 0.9);
		z-index: 1000;
	}

	/* Visibility is controlled by the [hidden] attribute (toggled in JS) so
	   the dialog state is a single source of truth, not a display string. */
	.modal[hidden] {
		display: none;
	}

	.modal-content {
		position: relative;
		width: 100%;
		height: 100%;
		display: flex;
		flex-direction: column;
	}

	.modal-header {
		background: #333;
		color: white;
		padding: 1rem;
		display: flex;
		justify-content: space-between;
		align-items: center;
	}

	.modal-title {
		font-size: 1.2rem;
		font-weight: bold;
	}

	.modal-counter {
		font-size: 0.9rem;
		color: #aaa;
		margin-left: 1rem;
	}

	.modal-diff-pct {
		font-size: 0.9rem;
		color: #ff6b6b;
		margin-left: 0.5rem;
	}

	.modal-close {
		background: none;
		border: none;
		color: white;
		font-size: 1.5rem;
		cursor: pointer;
	}

	.modal-body {
		flex: 1;
		display: flex;
		justify-content: center;
		align-items: center;
		overflow: auto;
	}

	.modal-image {
		max-width: 100%;
		max-height: 100%;
		object-fit: contain;
	}

	.modal-body.loading .modal-image {
		opacity: 0.3;
	}

	.modal-body.loading::after {
		content: '';
		position: absolute;
		width: 40px;
		height: 40px;
		border: 4px solid rgba(255, 255, 255, 0.3);
		border-top-color: white;
		border-radius: 50%;
		animation: spin 0.8s linear infinite;
	}

	@keyframes spin {
		to { transform: rotate(360deg); }
	}

	.modal-nav {
		position: absolute;
		top: 50%;
		transform: translateY(-50%);
		background: rgba(0, 0, 0, 0.5);
		color: white;
		border: none;
		padding: 1rem;
		cursor: pointer;
		font-size: 1.5rem;
	}

	.modal-prev {
		left: 0;
	}

	.modal-next {
		right: 0;
	}

	.modal-nav:hover {
		background: rgba(0, 0, 0, 0.8);
	}
</style>

<div id="diffModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
	<div class="modal-content">
		<div class="modal-header">
			<div class="modal-title" id="modalTitle"></div>
			<span class="modal-counter" id="modalCounter" aria-live="polite"></span>
			<span class="modal-diff-pct" id="modalDiffPct"></span>
			<button class="modal-close" aria-label="Close diff viewer" onclick="closeModal()"><span aria-hidden="true">&times;</span></button>
		</div>
		<div class="modal-body" id="modalBody">
			<button class="modal-nav modal-prev" aria-label="Previous diff" onclick="navigateDiff(-1)"><span aria-hidden="true">&larr;</span></button>
			<img id="modalImage" class="modal-image" src="" decoding="async" alt="Diff Image" onload="this.closest('.modal-body').classList.remove('loading'); this.closest('.modal-body').removeAttribute('aria-busy')">
			<button class="modal-nav modal-next" aria-label="Next diff" onclick="navigateDiff(1)"><span aria-hidden="true">&rarr;</span></button>
		</div>
	</div>
</div>

<script>
	let currentDiffIndex = 0;
	let diffs = [];
	let lastTrigger = null;

	function modalEl() {
		return document.getElementById('diffModal');
	}

	function isOpen() {
		return !modalEl().hidden;
	}

	function openModal(diffData, index, triggerEl) {
		// Remember what to return focus to when the dialog closes.
		lastTrigger = triggerEl || document.activeElement;
		currentDiffIndex = index;
		diffs = diffData;
		modalEl().hidden = false;
		updateModalContent();
		// Move focus into the dialog.
		document.querySelector('.modal-close').focus();
	}

	function closeModal() {
		modalEl().hidden = true;
		if (lastTrigger && typeof lastTrigger.focus === 'function') {
			lastTrigger.focus();
		}
	}

	function navigateDiff(direction) {
		currentDiffIndex = (currentDiffIndex + direction + diffs.length) % diffs.length;
		updateModalContent();
	}

	function updateModalContent() {
		const currentDiff = diffs[currentDiffIndex];
		document.getElementById('modalTitle').textContent =
			`${currentDiff.name} - ${currentDiff.urlKey} (${currentDiff.viewport.name})`;
		document.getElementById('modalCounter').textContent =
			`(${currentDiffIndex + 1} of ${diffs.length})`;
		document.getElementById('modalDiffPct').textContent =
			`${currentDiff.diffPercentage.toFixed(2)}%`;
		const modalBody = document.getElementById('modalBody');
		modalBody.classList.add('loading');
		modalBody.setAttribute('aria-busy', 'true');
		const modalImage = document.getElementById('modalImage');
		modalImage.alt =
			`Diff of ${currentDiff.urlKey} at ${currentDiff.viewport.name}`;
		// Set intrinsic dimensions before the source so the box is reserved
		// and the image doesn't reflow as it decodes.
		if (currentDiff.diffWidth && currentDiff.diffHeight) {
			modalImage.width = currentDiff.diffWidth;
			modalImage.height = currentDiff.diffHeight;
		}
		modalImage.src = currentDiff.diffUrl;
	}

	// Close modal when clicking outside
	window.onclick = function(event) {
		if (event.target === modalEl()) {
			closeModal();
		}
	}

	// Handle keyboard navigation and trap Tab within the dialog.
	document.addEventListener('keydown', function(event) {
		if (isOpen()) {
			if (event.key === 'Tab') {
				const focusable = modalEl().querySelectorAll('button');
				const first = focusable[0];
				const last = focusable[focusable.length - 1];
				if (event.shiftKey && document.activeElement === first) {
					event.preventDefault();
					last.focus();
				} else if (!event.shiftKey && document.activeElement === last) {
					event.preventDefault();
					first.focus();
				}
				return;
			}
			if (event.key === 'ArrowLeft') {
				navigateDiff(-1);
			} else if (event.key === 'ArrowRight') {
				navigateDiff(1);
			} else if (event.key === 'Escape') {
				closeModal();
			}
		}
	});
</script>
