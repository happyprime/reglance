<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{name} - {urlKey} - {viewportName} - Visual Comparison</title>
	<link rel="stylesheet" href="../assets/style.css">
</head>

<body>
	<div class="report-header">
		<div class="report-header-main">
			<a href="index.html" class="back-link">&larr; Back to overview</a>
			<h1>{name} &mdash; {urlKey}</h1>
			<div class="report-meta">
				<span class="meta-item">{viewportName} ({viewportWidth}&times;{viewportHeight})</span>
				<span class="meta-item diff-badge">{diffPercentage}% different</span>
			</div>
		</div>
		<details class="report-settings">
			<summary>Comparison Settings</summary>
			<div class="report-settings-grid">
				<span>Threshold: {threshold}</span>
				<span>Anti-Aliasing: {includeAA}</span>
				<span>Alpha: {alpha}</span>
			</div>
		</details>
	</div>
	<div class="compare">
		<div class="image-container">
			<img id="baseImage" src="{secondImage}" alt="Second Image">
			<div class="image-overlay">
				<img src="{originalImage}" alt="Original Image">
			</div>
			<div class="slider">
				<div class="slider-line"></div>
				<div class="slider-button"></div>
			</div>
			<div class="image-label left-label">Original Image</div>
			<div class="image-label right-label" id="rightLabel">Second Image</div>
			<button class="toggle-button" id="toggleButton">Show Diff</button>
		</div>
	</div>
	<script>
		const originalImage = "{originalImage}";
		const secondImage = "{secondImage}";
		const diffImage = "{diffImage}";
	</script>
	<script src="../assets/script.js"></script>
</body>
</html>
